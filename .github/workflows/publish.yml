name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every step but publish with --dry-run
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Protected environment: required reviewers and a `v*` tag rule are set in the repository settings.
    environment: release
    steps:
      - name: Real publishes run only from a tag
        if: ${{ !inputs.dry_run && github.ref_type != 'tag' }}
        run: echo "::error::publish from a v* tag" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # All three packages release together: one version, and the tag names it.
      - name: Packages are at one version, tag matches
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then bun scripts/release/versions.ts --tag "$GITHUB_REF_NAME"; else bun scripts/release/versions.ts; fi
      - run: bun install --frozen-lockfile
      - name: Audit runtime dependencies (fails on high or critical)
        run: bun audit --prod --audit-level=high
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - name: Audit bundled code (fails on high or critical)
        run: bun scripts/release/audit-bundled.ts
      - name: SBOM (CycloneDX), one per package
        run: |
          mkdir "$RUNNER_TEMP/sbom"
          for dir in . packages/*; do
            bun scripts/release/sbom.ts --dir "$dir" --out "$RUNNER_TEMP/sbom/$(basename "$(realpath "$dir")").cdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Archive gate (every package)
        run: bun run release:gate
      - name: Browsers for the playwright floor
        run: bunx playwright@1.49.0 install --with-deps chromium chromium-headless-shell
      - run: bun scripts/release/peer-floors.ts
      - run: bun run demo:test
      - run: bun run build
      - name: Stage every package
        run: |
          for dir in . packages/*; do
            name=$(bun -p "require('./$dir/package.json').name")
            bun run release:stage "$RUNNER_TEMP/liveframe-publish/${name#@arnilo/}" "$dir"
          done
      # npm runs only here, for trusted publishing and provenance.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish
        run: |
          npm --version | awk -F. '{ exit !($1 > 11 || ($1 == 11 && ($2 > 5 || ($2 == 5 && $3 >= 1)))) }'
          version=$(bun -p 'require("./package.json").version')
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          dry=; if [ "${{ inputs.dry_run }}" = true ]; then dry=--dry-run; fi
          # The core first: the other two peer on it. Each publish carries its own provenance.
          for dir in . packages/*; do
            name=$(bun -p "require('./$dir/package.json').name")
            npm publish "$RUNNER_TEMP/liveframe-publish/${name#@arnilo/}" --access public --tag "$tag" $dry
          done
          # A release moves `next` too, so `@next` never installs an older build than `latest`.
          # npm's trusted publisher must allow dist-tags, and only npm >= 11.21.0 (>= 12.2.0 on 12.x) does it.
          if [ -z "$dry" ] && [ "$tag" = latest ]; then
            for dir in . packages/*; do
              name=$(bun -p "require('./$dir/package.json').name")
              npx --yes npm@12.2.1 dist-tag add "$name@$version" next
            done
          fi
