name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Packages are at one version
        run: bun run release:versions
      - name: Audit runtime dependencies (fails on high or critical)
        run: bun audit --prod --audit-level=high
      - name: Audit all dependencies (informational)
        run: bun audit
        continue-on-error: true
      - run: bunx playwright install --with-deps chromium webkit firefox
      - run: bun run check
      - name: Audit bundled code (fails on high or critical)
        run: bun scripts/release/audit-bundled.ts
      - name: SBOM (CycloneDX), one per package
        run: |
          mkdir "$RUNNER_TEMP/sbom"
          for dir in . packages/*; do
            bun scripts/release/sbom.ts --dir "$dir" --out "$RUNNER_TEMP/sbom/$(basename "$(realpath "$dir")").cdx.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Browser suites (WebKit)
        run: LIVEFRAME_BROWSER=webkit bun run test
      - name: Browser suites (Firefox)
        run: LIVEFRAME_BROWSER=firefox bun run test
      - name: Archive gate (every package)
        run: bun run release:gate
      - name: Browsers for the playwright floor
        run: bunx playwright@1.49.0 install --with-deps chromium chromium-headless-shell
      - run: bun scripts/release/peer-floors.ts
      - run: bun run demo:test
      - name: Bench (informational)
        run: bun run bench
        continue-on-error: true
