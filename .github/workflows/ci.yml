name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - run: bun scripts/release/archive-gate.ts
      - name: Browsers for the playwright floor
        run: bunx playwright@1.49.0 install --with-deps chromium chromium-headless-shell
      - run: bun scripts/release/peer-floors.ts
      - run: bun run demo:test
      - name: Bench (informational)
        run: bun run bench
        continue-on-error: true
